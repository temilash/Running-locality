services:
  keep-local-locality:
    container_name: keep-local-locality
    image: temi101/keep-local-locality:latest
    build:
      context: .
      network: host
      platforms:
        - linux/amd64
        - linux/arm64
    env_file:
      - path: .env
        required: false
    environment:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID:-}.r2.cloudflarestorage.com
      R2_BUCKET: ${R2_BUCKET:-}
      CC: ${CC:-}
      TZ: ${TZ:-}
    entrypoint: ["/bin/bash"]
    command:
      - -c
      - |
        set -uo pipefail
        SCHEDULED_TIMES="04:00 12:00 20:00"
        END=$(( $(date +%s) + 9*24*3600 ))
        while [ "$(date +%s)" -lt "$$END" ]; do
          NOW=$(date +%s)
          NEXT=""
          for t in $$SCHEDULED_TIMES; do
            CANDIDATE=$(date -d "today $$t" +%s)
            if [ "$$CANDIDATE" -le "$$NOW" ]; then
              CANDIDATE=$(date -d "tomorrow $$t" +%s)
            fi
            if [ -z "$$NEXT" ] || [ "$$CANDIDATE" -lt "$$NEXT" ]; then
              NEXT=$$CANDIDATE
            fi
          done
          SLEEP_SECS=$(( NEXT - NOW ))
          echo "[.] $(date): sleeping until $(date -d "@$$NEXT") ($$SLEEP_SECS seconds)"
          sleep "$$SLEEP_SECS"
          [ "$(date +%s)" -lt "$$END" ] || break
          RUN_TAG="run_$(date +%Y%m%d_%H%M)"
          STATUS=0
          for tier in 1000 10000; do
            RUN_TAG="$$RUN_TAG" src/har_locality/run_from_sampled.sh "data/top_1k_files/sampled/202608/$$tier" || STATUS=1
          done
          echo "[+] $(date): completed scheduled run tag=$$RUN_TAG status=$$STATUS"
        done
        echo "[+] $(date): 9-day schedule finished"
